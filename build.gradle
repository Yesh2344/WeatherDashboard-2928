plugins {
    id 'java'
    id 'application'
}

group = 'com.example'
version = '1.0.0'
description = 'Weather Dashboard – console app with OpenWeatherMap integration'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    // HTTP client (java.net.http is built‑in, no external dep needed)
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'org.slf4j:slf4j-api:2.0.9'
    runtimeOnly 'ch.qos.logback:logback-classic:1.5.3'
    implementation 'io.github.cdimascio:java-dotenv:5.2.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}

application {
    // Main class fully qualified name
    mainClass = 'com.example.weather.WeatherDashboardApplication'
}

tasks.named('test') {
    useJUnitPlatform()
}
